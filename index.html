<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>"Receita Reversa" - Chef com IA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap');
        
        body, html {
            margin: 0; padding: 0; font-family: 'Poppins', sans-serif;
            background: black; color: white; overflow: hidden;
        }

        /* --- CORREÇÃO DO BOTÃO DE PLAY E TRANSIÇÃO SUAVE --- */
        video {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 0;
            /* Começa invisível para não mostrar o ícone de play piscando */
            opacity: 0; 
            transition: opacity 0.5s ease-in-out;
        }

        /* Remove o botão de play padrão do Android/Chrome */
        video::-webkit-media-controls { display: none !important; }
        video::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none; }

        canvas { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 0;
            display: none; 
        }

        /* --- ESTILOS DO PREMIUM --- */
        #premium-container { position: absolute; top: 15px; right: 15px; z-index: 50; }
        #btn-premium {
            background-color: #f59e0b; color: #451a03; padding: 8px 16px;
            border-radius: 50px; font-size: 12px; font-weight: 700;
            text-decoration: none; display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5); transition: background-color 0.3s;
        }
        #btn-premium:hover { background-color: #fbbf24; }
        #premium-success {
            display: none; background-color: #22c55e; color: white;
            padding: 8px 16px; border-radius: 50px; font-size: 12px; font-weight: 700;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        .hidden { display: none !important; }
        .premium-block { text-align: center; padding: 40px 20px; margin-top: 30px; }
        .premium-block h3 { color: #f59e0b; font-size: 1.5em; margin-bottom: 15px; }
        .premium-block p { color: #d1d5db; font-size: 1em; margin-bottom: 30px; line-height: 1.6; }
        /* -------------------------- */

        #ui-container { position: fixed; bottom: 0; left: 0; width: 100%; z-index: 2; }
        #controls {
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0));
            text-align: center;
        }
        button.action-btn {
            background-color: #f59e0b; color: white; padding: 15px 30px; border: none;
            border-radius: 50px; font-size: 18px; font-weight: 700; cursor: pointer;
            transition: all 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 100%;
            max-width: 400px;
        }
        button.action-btn:hover:not(:disabled) { background-color: #d97706; transform: translateY(-2px); }
        button:disabled { background: #555 !important; cursor: not-allowed; opacity: 0.7; transform: none !important; }
        
        #optional-inputs { padding: 0 20px 20px 20px; display: flex; gap: 15px; justify-content: center; }
        .input-group { flex: 1; max-width: 300px; }
        
        /* Estilos dos campos de texto alinhados */
        .input-group input, .input-group textarea { 
            width: 100%; padding: 5px 10px 25px; border-radius: 8px; border: 1px solid #444; 
            background: #222; color: white; box-sizing: border-box;
            font-family: 'Poppins', sans-serif; resize: vertical;
        }

        #output-panel {
            background: #111; padding: 15px; max-height: 85vh; overflow-y: auto;
            box-sizing: border-box; border-top: 1px solid #444;
            border-top-left-radius: 20px; border-top-right-radius: 20px;
        }
        .status-text { text-align: center; padding: 20px; font-size: 1.1em; }
        .recipe-card {
            background: #1e1e1e; border: 1px solid #444; border-radius: 12px;
            padding: 20px; margin-bottom: 20px;
        }
        .recipe-card h2 { margin-top: 0; color: #f59e0b; }
        .recipe-card h3 { border-bottom: 1px solid #444; padding-bottom: 5px; margin-top: 20px; }
        .recipe-card ul, .recipe-card ol { padding-left: 20px; }

        @media (max-width: 600px) {
            #optional-inputs { flex-direction: column; align-items: center; }
            .input-group { width: 100%; max-width: none; }
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="premium-container">
        <a href="receita://assinar" id="btn-premium">Assinar Premium</a>
        <div id="premium-success">Premium ✓</div>
    </div>

    <div id="ui-container">
        <div id="output-panel" style="display:none;"></div>
        <div id="controls">
            <div id="optional-inputs">
                <div class="input-group">
                    <textarea id="restricoes" placeholder="Restrições? (ex: vegetariano, sem glúten)" rows="1"></textarea>
                </div>
                <div class="input-group">
                    <textarea id="tipo_culinaria" placeholder="Tipo de Culinária? (ex: italiana, caseira)" rows="1"></textarea>
                </div>
            </div>
            <button id="captureBtn" class="action-btn">🍲 Criar Receita</button>
        </div>
    </div>

    <script>
        // --- VARIÁVEIS DE CONTROLE PREMIUM E DISPOSITIVO ---
        let isUserPremium = false;
        let userDeviceId = "dispositivo-desconhecido"; // Atualizado automaticamente pelo Android

        const btnPremium = document.getElementById('btn-premium');
        const premiumSuccess = document.getElementById('premium-success');

        // Comunicação com o Android (Preço e Status Premium)
        window.updatePremiumPrice = function(priceString) {
            if (btnPremium) {
                btnPremium.innerText = "Assinar Premium " + priceString;
            }
        };

        window.setPremiumStatus = function(isPremium) {
            isUserPremium = isPremium; 
            if (isPremium) {
                if (btnPremium) btnPremium.classList.add('hidden');
                if (premiumSuccess) {
                    premiumSuccess.style.display = 'inline-block';
                }
            }
        };

        // Recebe a injeção do Android_ID para vincular ao banco de dados e evitar fraudes
        window.setDeviceId = function(id) {
            userDeviceId = id;
        };

        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const outputPanel = document.getElementById("output-panel");
        const controlsDiv = document.getElementById("controls");
        const captureBtn = document.getElementById("captureBtn");
        
        async function startCamera() { 
            try { 
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: { ideal: "environment" }, 
                        width: { ideal: 1920 }, 
                        height: { ideal: 1080 } 
                    } 
                }); 
                video.srcObject = stream; 
                
                video.onloadedmetadata = () => {
                    video.style.opacity = 1;
                };
                
            } catch (err) { 
                alert("Erro ao acessar a câmera."); 
            } 
        }

        function resetUI() {
            canvas.style.display = 'none';
            video.style.display = 'block';
            outputPanel.style.display = 'none';
            outputPanel.innerHTML = '';
            controlsDiv.style.display = 'block';
            captureBtn.disabled = false;
            setTimeout(() => { video.style.opacity = 1; }, 100);
        }

        // Função auxiliar para exibir a tela de bloqueio quando a cota acabar
        function showPremiumBlock(mensagem) {
            video.style.opacity = 0;
            setTimeout(() => { video.style.display = 'none'; }, 300);
            controlsDiv.style.display = 'none';

            outputPanel.innerHTML = `
                <div class="premium-block">
                    <p style="font-size: 50px; margin: 0;">⭐</p>
                    <h3>Assinatura Necessária</h3>
                    <p>${mensagem}</p>
                    <button onclick="resetUI()" class="action-btn">🔙 Voltar para a Câmera</button>
                </div>
            `;
            outputPanel.style.display = 'block';
        }

        captureBtn.addEventListener('click', async () => {
            captureBtn.disabled = true;
            
            const MAX_WIDTH = 1024;
            const scale = MAX_WIDTH / video.videoWidth;
            canvas.width = MAX_WIDTH;
            canvas.height = video.videoHeight * scale;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            video.style.display = 'none';
            video.style.opacity = 0;
            canvas.style.display = 'block';
            controlsDiv.style.display = 'none';

            outputPanel.innerHTML = `<div class="status-text">👨‍🍳 Analisando ingredientes e pensando em uma receita...</div>`;
            outputPanel.style.display = 'block';

            try {
                const imageDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                const restricoes = document.getElementById('restricoes').value;
                const tipo_culinaria = document.getElementById('tipo_culinaria').value;

                const response = await fetch('/api/create-recipe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    // Envia imagem, contexto, dados do dispositivo e status da assinatura para a Vercel
                    body: JSON.stringify({ 
                        image: imageDataUrl, 
                        restricoes, 
                        tipo_culinaria,
                        deviceId: userDeviceId,
                        isPremium: isUserPremium
                    }),
                });

                const data = await response.json();

                // Intercepta a resposta 403 da API indicando que as 5 consultas grátis acabaram
                if (response.status === 403 && data.limitReached) {
                    showPremiumBlock("Você atingiu o limite de 5 receitas gratuitas! Assine o Premium no botão acima para continuar criando pratos incríveis sem limites.");
                    return;
                }

                if (!response.ok) {
                    throw new Error(`Erro na API: ${response.statusText}`);
                }
                
                renderRecipes(data);

            } catch (error) {
                outputPanel.innerHTML = `<div class="status-text" style="color:red;">❌ Ocorreu um erro. Tente novamente.</div>`;
                setTimeout(resetUI, 3000);
            }
        });

        function renderRecipes(data) {
            if (!data.receitas || data.receitas.length === 0) {
                outputPanel.innerHTML = `<div class="status-text">🤔 Não consegui criar uma receita com estes ingredientes. Tente uma foto com melhor iluminação.</div>`;
                setTimeout(resetUI, 4000);
                return;
            }

            let html = data.receitas.map(recipe => {
                const ingredientesIdentificadosHTML = recipe.ingredientes_identificados.map(ing => `<li>${ing}</li>`).join('');
                const ingredientesAdicionaisHTML = recipe.ingredientes_adicionais.map(ing => `<li>${ing}</li>`).join('');
                const modoPreparoHTML = recipe.modo_preparo.map(step => `<li>${step}</li>`).join('');
                
                return `
                    <div class="recipe-card">
                        <h2>${recipe.titulo}</h2>
                        <p><em>${recipe.descricao}</em></p>
                        <p><strong>Tempo:</strong> ${recipe.tempo_preparo} | <strong>Dificuldade:</strong> ${recipe.dificuldade}</p>
                        
                        <h3>Ingredientes Usados da Foto</h3>
                        <ul>${ingredientesIdentificadosHTML}</ul>
                        
                        <h3>Ingredientes Adicionais</h3>
                        <ul>${ingredientesAdicionaisHTML}</ul>
                        
                        <h3>Modo de Preparo</h3>
                        <ol>${modoPreparoHTML}</ol>
                    </div>
                `;
            }).join('');

            const retryButtonHTML = `<div style="padding: 20px; text-align: center;"><button onclick="resetUI()" class="action-btn">Analisar Outros Ingredientes</button></div>`;
            outputPanel.innerHTML = html + retryButtonHTML;
        }

        startCamera();
    </script>
</body>
</html>
